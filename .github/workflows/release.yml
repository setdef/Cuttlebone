# Builds, verifies and publishes the prebuilt binaries (docs/releases.md).
#
# A pushed version tag (v0.12.0) builds every target, verifies each archive
# on its own platform, publishes them with manifest.json and the release
# index (index.json) as the tag's GitHub release, and then checks the
# published release from its manifest's and index's URLs alone. Run by
# hand (workflow_dispatch), it builds and verifies without publishing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            # The oldest macOS Inko supports and tests, which the build
            # targets (MACOSX_DEPLOYMENT_TARGET in scripts/dist-build.sh).
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the pinned upstream release
        run: scripts/upstream.sh
      - name: Install LLVM 18
        if: runner.os == 'macOS'
        run: brew install llvm@18 zstd
      - name: Build, and check what it links
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            scripts/dist-build.sh
          else
            scripts/dist-linux.sh
          fi
      - name: Check the archive's target
        run: test -f "dist/$(cd dist && ls *-${{ matrix.target }}.tar.gz)"
      - name: Verify the archive
        run: |
          archive=$(ls dist/*-${{ matrix.target }}.tar.gz)
          if [ "$RUNNER_OS" = macOS ]; then
            python3 scripts/dist-verify.py "$archive"
          else
            python3 scripts/dist-verify.py "$archive" --docker alpine:3.22
            python3 scripts/dist-verify.py "$archive" --docker ubuntu:24.04
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Check the tag against the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$TAG" = "v$version" || { echo "tag $TAG, but Cargo.toml says $version" >&2; exit 1; }
      - name: Write the manifest and the release notes
        run: |
          python3 scripts/dist-manifest.py \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" dist/*.tar.gz > dist/manifest.json
          cat dist/manifest.json
          # The index: every published release with a manifest, and this one.
          base="https://github.com/$GITHUB_REPOSITORY/releases/download"
          older=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft or .prerelease | not) | select(any(.assets[]; .name == "manifest.json")) | .tag_name' |
            sed "s|.*|$base/&/manifest.json|")
          python3 scripts/dist-index.py --use "$base/$TAG/manifest.json=dist/manifest.json" \
            "$base/$TAG/manifest.json" $older > dist/index.json
          cat dist/index.json
          {
            # The version's entry in CHANGELOG.md, without its heading.
            awk -v h="## ${TAG#v}" '$0 == h {on = 1; next} /^## / {on = 0} on' CHANGELOG.md
            echo
            echo "Each archive works with one Inko version, which its name says."
            echo "Machine-readable list of the builds, with sizes and SHA-256:"
            echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/manifest.json"
            echo "Every release, with its Inko versions and manifest:"
            echo "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/index.json"
            echo "(docs/releases.md)."
          } > notes.md
      - name: Publish the release
        run: gh release create "$TAG" dist/*.tar.gz dist/manifest.json dist/index.json --title "Cuttlebone ${TAG#v}" --notes-file notes.md --verify-tag

  check:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    name: check the published release on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the pinned upstream release (the verifier's standard library)
        run: scripts/upstream.sh
      - name: Download, check and run every build this runner can
        run: |
          python3 scripts/dist-check-release.py --partial \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/${{ github.ref_name }}/manifest.json"
      - name: Check the release index, at the tag's URL and the latest release's
        run: |
          for url in "download/${{ github.ref_name }}" latest/download; do
            python3 scripts/dist-check-index.py --newest "${GITHUB_REF_NAME#v}" \
              "https://github.com/$GITHUB_REPOSITORY/releases/$url/index.json"
          done
