[package]
name = "cuttlebone"
version = "0.15.0"
edition = "2024"
license = "MPL-2.0"
publish = false
default-run = "cuttlebone"
# The tests are two binaries (tests/main.rs and tests/latency.rs), not one
# per file.
autotests = false

[dependencies]
# The pinned upstream release with patches/upstream.patch applied, prepared by
# scripts/upstream.sh.
compiler = { path = ".upstream/inko/compiler" }
types = { path = ".upstream/inko/types" }
location = { path = ".upstream/inko/location" }
ast = { path = ".upstream/inko/ast" }
serde_json = "1"
unicode-segmentation = "1"
lsp-server = "0.10"
lsp-types = "=0.95.1"
crossbeam-channel = "0.5.17"
url = "2"
serde = { version = "1", features = ["derive"] }

# The upstream compiler's inkwell asks for libffi as a dynamic library,
# which a static musl build can't have. This feature (unified with the
# compiler's) drops that, and scripts/dist-build.sh links libffi.a itself.
[target.'cfg(target_env = "musl")'.dependencies]
inkwell = { version = "0.8", features = ["no-libffi-linking"] }

[features]
# CUTTLEBONE_FAULT, which makes workers hang, abort or skip repaired copies (docs/lsp.md, "Testing
# faults"). Only the tests enable it, through the dev-dependency below, so
# release builds don't contain it.
fault-injection = []

[dev-dependencies]
# The crate itself, so that `cargo test` builds the library and the
# binaries the tests run with fault injection.
cuttlebone = { path = ".", features = ["fault-injection"] }

[[bin]]
name = "cuttlebone"
path = "src/bin/cuttlebone.rs"
# The binaries have no tests of their own.
test = false

[[bin]]
name = "dump-types"
path = "src/bin/dump-types.rs"
test = false

[[test]]
name = "integration"
path = "tests/main.rs"

[[test]]
name = "latency"
path = "tests/latency.rs"

[profile.release]
debug = "line-tables-only"

# The upstream compiler is too slow unoptimized for the latency limits in
# tests/e2e.rs, so dependencies are optimized even in debug builds.
[profile.dev.package."*"]
opt-level = 3

# Cuttlebone's own code too, a little: the latency limits measure it
# closer to how it's released, and on CI runners, its unoptimized code
# was slower against the baseline (scripts/latency.sh) than on the
# reference machine (docs/history/MILESTONE-14.md).
[profile.dev]
opt-level = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Every default clippy lint is an error, so `cargo clippy` fails instead of
# warning.
all = { level = "deny", priority = -1 }
# stdout is the LSP channel (and a worker's answer), so nothing may print to
# it by accident. stderr is the server's log, written only through
# lsp::log. Binaries allow these where printing is their job.
print_stdout = "deny"
print_stderr = "deny"
